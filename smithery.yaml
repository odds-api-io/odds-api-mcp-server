startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: Odds-API.io API key (paid plans at odds-api.io/pricing)
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "odds-api-mcp-server"],
      env: { ODDS_API_KEY: config.apiKey }
    })
